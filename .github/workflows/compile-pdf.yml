name: Build PDF Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate PDF
        run: npm run pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: |
            **/*.pdf
            !node_modules/**
          if-no-files-found: error
