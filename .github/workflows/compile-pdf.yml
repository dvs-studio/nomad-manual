name: Build Nomad Manual PDF

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies for PDF engine
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libffi-dev libjpeg-dev libopenjp2-7-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node.js dependencies
        run: npm install

      - name: Install Python requirements
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install weasyprint
          fi

      - name: Build assets
        run: npm run build --if-present

      - name: Generate PDF
        run: npm run pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: nomad-sculpt-manual-pdf
          path: |
            **/*.pdf
            dist-pdfs/
            artifacts/pdfs/
          if-no-files-found: warn
